# https://github.com/astrale-sharp/wasm-minimal-protocol/blob/master/examples/hello_rust/Cargo.toml
[package]
name = "zhconv-typst"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-minimal-protocol = "=0.2.1"
zhconv = { path = "../", default-features = false, features = ["opencc", "opencc-twp", "opencc-hkp", "compress", "cjk-compat"] }

[profile.release]
lto = true          # Enable link-time optimization
strip = true        # Strip symbols from binary*
opt-level = 'z'     # Optimize for size
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic

[workspace] # so that it is not included in the upper workspace

[dev-dependencies]
serde_json = "1"
